<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded obsidian dark backdrop -->
  <rect width="128" height="128" rx="28" fill="#0A0B0E"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Architectural Avrasya Crest in Crisp White & Brass -->
  <g transform="translate(24, 20)">
    <!-- Base Bosphorus foundation curve -->
    <path d="M 6 78 Q 40 68 74 78" stroke="#D4AF37" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Outer left pillar -->
    <path d="M 14 74 L 14 48 L 23 42 L 23 72" fill="#13171F" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Mid left tower -->
    <path d="M 28 70 L 28 32 L 40 24 L 40 69" fill="#13171F" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Central pinnacle tower -->
    <path d="M 40 69 L 40 16 L 49 5 L 58 16 L 58 69" fill="#FFFFFF" stroke="#0A0B0E" stroke-width="1.5"/>
    <path d="M 49 16 L 49 64" stroke="#0A0B0E" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mid right tower -->
    <path d="M 58 69 L 58 24 L 70 32 L 70 70" fill="#13171F" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Outer right pillar -->
    <path d="M 75 72 L 75 42 L 84 48 L 84 74" fill="#13171F" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
