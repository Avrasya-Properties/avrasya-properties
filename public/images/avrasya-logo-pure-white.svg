<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Architectural skyline crest in crisp pure white -->
  <g transform="translate(10, 8)">
    <!-- Base curve -->
    <path d="M 4 58 Q 32 50 60 58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Outer left pillar -->
    <path d="M 12 55 L 12 36 L 19 32 L 19 54" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Mid left tower -->
    <path d="M 23 53 L 23 24 L 32 18 L 32 52" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Central pinnacle tower -->
    <path d="M 32 52 L 32 12 L 39 4 L 46 12 L 46 52" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Central tower inner cut -->
    <path d="M 39 12 L 39 48" stroke="#0E232E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mid right tower -->
    <path d="M 46 52 L 46 18 L 55 24 L 55 53" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Outer right pillar -->
    <path d="M 59 54 L 59 32 L 66 36 L 66 55" fill="#FFFFFF" fill-opacity="0.92" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
  <!-- Brand Typography in crisp pure white -->
  <g transform="translate(95, 14)">
    <text x="0" y="32" font-family="'Newsreader', Georgia, serif" font-size="28" font-weight="500" letter-spacing="4" fill="#FFFFFF">AVRASYA</text>
    <text x="1" y="47" font-family="'Manrope', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#FFFFFF" fill-opacity="0.85">PROPERTIES GROUP · ISTANBUL</text>
  </g>
</svg>
