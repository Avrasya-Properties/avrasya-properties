name: Admin checks
on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/admin-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run typecheck
      - run: bun scripts/admin-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-smoke-failure
          path: test-results/
          if-no-files-found: ignore
